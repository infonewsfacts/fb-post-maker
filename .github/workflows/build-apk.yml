name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/clipboard@7 @capacitor/browser@7
          npx cap init "FB Post Maker" com.fbpostmaker.app --web-dir www
          npx cap add android

      - name: Android tweaks (status bar, no edge-to-edge overlap)
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n        <item name="android:statusBarColor">#14161b</item>\n        <item name="android:navigationBarColor">#14161b</item>\n        <item name="android:windowLightStatusBar">false</item>|' "$STYLES"
          cat "$STYLES"
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FB-Post-Maker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FB-Post-Maker-apk
          path: FB-Post-Maker.apk

      - name: Publish release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FB Post Maker v${{ github.run_number }}
          files: FB-Post-Maker.apk
